# Optional drop-in: /etc/systemd/system/vault-unseal.service.d/credentials.conf
# Configure storage.provider: systemd and remove inline unseal_tokens first.
[Service]
LoadCredentialEncrypted=vault-unseal-share-1:/etc/credstore.encrypted/vault-unseal-share-1.cred
LoadCredentialEncrypted=vault-unseal-share-2:/etc/credstore.encrypted/vault-unseal-share-2.cred
